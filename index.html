<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
        }

        .pdf-btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .pdf-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>AI PDF Document</h1>

    <a href="ai.pdf" target="_blank" class="pdf-btn">
        📄 Open AI PDF
    </a>

</body>
</html>
